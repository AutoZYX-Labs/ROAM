  <style>
    :root {
      --blue: #17375e;
      --blue-2: #4f81bd;
      --red: #b30000;
      --red-soft: #f7e8e8;
      --blue-soft: #edf4fb;
      --ink: #111111;
      --muted: #5f6b7a;
      --line: #cbd5df;
      --paper: #ffffff;
      --app-bg: #eef1f5;
      --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--app-bg); color: var(--ink); font-family: var(--sans); }
    body { overflow-x: hidden; }
    body.mobile-presenting { overflow: hidden; touch-action: none; }
    a { color: inherit; }
    button, select { font-family: inherit; }

    .deck-app {
      --fsw: 1280px;
      --fsh: 720px;
      --fss: 1;
      min-height: 100vh;
      padding: 16px 28px 22px;
      background:
        linear-gradient(90deg, rgba(23, 55, 94, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, #fafafa 0%, #e6ebf1 100%);
      background-size: 44px 44px, auto;
    }

    .deck-app:fullscreen { padding: 0; overflow: hidden; background: #07101d; }
    .deck-app.is-mobile-presenting {
      position: fixed;
      inset: 0;
      z-index: 9999;
      min-height: 100dvh;
      padding: 0;
      overflow: hidden;
      background: #07101d;
    }
    .deck-topbar, .deck-bottombar {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #2d3a4b;
    }
    .deck-topbar { margin-bottom: 10px; }
    .deck-title { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: #526173; }
    .deck-title a { color: var(--blue); font-size: 18px; text-decoration: none; }
    .deck-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .deck-control, .deck-select, .deck-nav {
      min-height: 34px;
      border: 1px solid #bcc8d6;
      border-radius: 6px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.9);
      color: #334155;
      font-size: 13px;
      cursor: pointer;
    }
    .deck-control:hover, .deck-nav:hover { border-color: var(--blue); color: var(--blue); }
    .deck-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .deck-primary:hover { background: #0d2747; color: #fff; }

    .deck-stage {
      position: relative;
      width: 100%;
      max-width: 1280px;
      height: min(720px, calc(100vh - 138px));
      min-height: 620px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(23, 55, 94, 0.18);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    }

    .deck-stage[data-theme="paper"] .slide { background: #fffdf8; }
    .deck-stage[data-theme="white"] .slide { background: #fff; }
    .deck-stage[data-theme="blueprint"] .slide {
      background:
        linear-gradient(90deg, rgba(79,129,189,0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(79,129,189,0.08) 1px, transparent 1px),
        #fff;
      background-size: 36px 36px;
    }

    .deck-app.is-fullscreen .deck-stage {
      width: 100vw;
      height: 100vh;
      max-width: none;
      min-height: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #07101d;
    }
    .deck-app.is-fullscreen .slide {
      position: absolute;
      inset: auto;
      left: 50%;
      top: 50%;
      width: var(--fsw);
      height: var(--fsh);
      min-height: 0;
      transform: translate(-50%, -50%) scale(var(--fss));
      transform-origin: center;
    }
    .deck-app.is-fullscreen .slide-body { align-content: start; }
    .deck-app.is-fullscreen [data-key="summary"] .slide-body { align-content: space-between; }
    .deck-app.is-fullscreen .body-two,
    .deck-app.is-fullscreen .body-three,
    .deck-app.is-fullscreen .body-figure { align-items: start; }
    .deck-app.is-fullscreen .deck-topbar,
    .deck-app.is-fullscreen .deck-bottombar {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 50;
      max-width: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .deck-app.is-fullscreen .deck-topbar { top: 0; padding: 10px 16px; transform: translateY(-110%); }
    .deck-app.is-fullscreen .deck-bottombar { bottom: 0; justify-content: center; padding: 8px 14px; transform: translateY(110%); }
    .deck-app.is-fullscreen.show-top .deck-topbar,
    .deck-app.is-fullscreen.show-bottom .deck-bottombar {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .orientation-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #07101d;
      color: #fff;
      text-align: center;
    }
    .orientation-hint div { max-width: 320px; }
    .orientation-hint strong { display: block; font-size: 24px; font-weight: 500; }
    .orientation-hint span { display: block; margin-top: 10px; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.72); }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
      font-weight: 400;
    }
    .slide.is-active { display: block; }
    .slide-inner { position: relative; height: 100%; padding: 28px 46px 62px; display: flex; flex-direction: column; gap: 16px; }
    .slide-body { flex: 1 1 auto; min-height: 0; display: grid; gap: 18px; align-content: start; }
    .body-two,
    .body-three,
    .body-figure {
      display: grid;
      gap: 18px;
      min-height: 0;
    }
    .body-two { grid-template-columns: minmax(0, 1fr) minmax(0, 0.96fr); }
    .body-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .body-figure { grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); align-items: stretch; }
    .slide:not(.cover):not(.thanks)::after {
      content: "Automated Driving Safety | Yuxin Zhang";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 46px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .kicker { margin: 0 0 7px; color: var(--blue); font-size: 14px; line-height: 1; letter-spacing: .02em; }
    .slide h2 {
      position: relative;
      margin: 0;
      min-height: 60px;
      color: var(--blue);
      font-size: 37px;
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: 0;
    }
    .slide h2::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50px;
      width: 110px;
      height: 4px;
      border: 1px solid var(--blue-2);
      background: linear-gradient(90deg, #b5c6e0, #8eaadb 58%, var(--blue-2));
    }
    .lead { margin: 0; font-size: 20px; line-height: 1.66; color: #151515; }
    .small { font-size: 15px; color: var(--muted); line-height: 1.55; }
    .muted { color: var(--muted); }
    .blue { color: var(--blue); }
    .red { color: var(--red); }
    .center { text-align: center; }

    .cover { padding: 0; }
    .cover-layout { height: 100%; display: grid; grid-template-rows: minmax(0, 0.53fr) minmax(0, 0.47fr); }
    .cover-media { margin: 0; overflow: hidden; background: #d8dee7; }
    .cover-media video, .cover-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .cover-bottom { display: grid; grid-template-rows: auto 1fr; gap: 18px; padding: 24px 46px 28px; background: #fff; box-shadow: 0 -18px 46px rgba(23,55,94,.1); }
    .cover-title-cn { margin: 0; color: var(--blue); font-size: 42px; line-height: 1.15; font-weight: 400; }
    .cover-title-en { margin: 5px 0 0; color: #315f93; font-size: 19px; line-height: 1.2; font-weight: 400; text-transform: uppercase; }
    .cover-meta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 0.38fr); gap: 36px; align-items: end; }
    .speaker strong { display: block; font-size: 26px; line-height: 1.2; font-weight: 400; color: #111; }
    .speaker p { margin: 6px 0 0; font-size: 19px; line-height: 1.38; color: #111; }
    .speaker .date { display: block; margin-top: 16px; color: #9a9a9a; font-size: 15px; font-weight: 600; }
    .logos { display: grid; gap: 8px; justify-items: end; align-content: end; }
    .logos img { display: block; width: 100%; max-width: 390px; max-height: 62px; object-fit: contain; object-position: right center; }
    .logos img.logo-partner-strip { max-width: 390px; max-height: 48px; }

    .agenda .slide-inner { justify-content: flex-start; }
    .agenda h2 { margin-top: 21px; }
    .agenda-list { display: grid; gap: 18px; margin: 78px 0 0; padding: 0; list-style: none; }
    .agenda-list li { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: baseline; font-size: 28px; line-height: 1.35; color: #111; }
    .agenda-list span { color: var(--blue); font-size: 18px; font-weight: 400; }
    .agenda-list strong { font-weight: 400; }
    .agenda-list li.current span, .agenda-list li.current strong { color: var(--red); }

    .card, .metric, .panel, .mini-card, .source-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      color: #111;
    }
    .card { padding: 16px 18px; }
    .card h3, .panel h3 { margin: 0 0 8px; color: var(--blue); font-size: 23px; line-height: 1.28; font-weight: 500; }
    .card p, .panel p { margin: 0; font-size: 16px; line-height: 1.55; color: #1f2937; }
    .card.red { border-left: 6px solid var(--red); background: var(--red-soft); }
    .card.blue { border-left: 6px solid var(--blue); background: var(--blue-soft); }
    .card strong { color: var(--blue); font-weight: 600; }
    .callout { margin: 0; padding: 14px 18px; border-left: 6px solid var(--red); border-radius: 8px; background: var(--red-soft); color: #111; font-size: 20px; line-height: 1.5; }
    .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .list li { padding: 12px 14px; border-left: 5px solid var(--blue); border-radius: 6px; background: var(--blue-soft); font-size: 17px; line-height: 1.46; }
    .list li.red { border-left-color: var(--red); background: var(--red-soft); }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .metric { min-height: 96px; padding: 13px 14px; display: grid; place-content: center; text-align: center; }
    .metric strong { display: block; color: var(--blue); font-size: 34px; line-height: 1; font-weight: 500; }
    .metric span { display: block; margin-top: 8px; color: #111; font-size: 15px; line-height: 1.25; }
    .metric.compact { min-height: 78px; padding: 10px 12px; }
    .metric.compact strong { font-size: 24px; line-height: 1.12; }
    .metric.compact span { margin-top: 6px; font-size: 14px; }

    .figure { margin: 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
    .figure img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .figure.cover-fit img { object-fit: cover; object-position: top center; }
    .figure.tight { border: 0; }
    .figure.document-shot { display: block; background: #f8fafc; }
    .figure.document-shot img { object-fit: cover; object-position: top center; }
    .figure.report-cover { background: #06111f; }
    .figure.report-cover img { object-fit: cover; object-position: center; }
    .visual-stack { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; }

    .layer-state-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr);
      gap: 18px;
      min-height: 0;
      align-items: stretch;
    }
    .layer-state-map {
      min-height: 0;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(237,244,251,.92), #fff 34%);
    }
    .risk-axis {
      position: relative;
      display: grid;
      place-items: center;
      color: var(--blue);
      font-size: 13px;
      line-height: 1.15;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: .04em;
    }
    .risk-axis::before {
      content: "";
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 50%;
      width: 2px;
      background: linear-gradient(180deg, var(--red), var(--blue));
      transform: translateX(-50%);
    }
    .risk-axis::after {
      content: "";
      position: absolute;
      top: 13px;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid var(--red);
      transform: translateX(-50%);
    }
    .state-rail { display: grid; gap: 10px; align-content: stretch; }
    .state-band {
      position: relative;
      min-height: 96px;
      display: grid;
      grid-template-columns: 60px minmax(0, 1.04fr) minmax(190px, .96fr);
      gap: 14px;
      align-items: center;
      padding: 13px 16px;
      border: 1px solid #d7e1ec;
      border-left: 8px solid var(--blue);
      border-radius: 8px;
      background: #fff;
    }
    .state-band.red { border-left-color: var(--red); background: var(--red-soft); }
    .state-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--blue);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
    }
    .state-band.red .state-num { background: var(--red); }
    .state-main strong { display: block; color: var(--blue); font-size: 23px; line-height: 1.15; font-weight: 500; }
    .state-band.red .state-main strong { color: var(--red); }
    .state-main span { display: block; margin-top: 5px; color: #111; font-size: 15px; line-height: 1.35; }
    .state-meta {
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--blue-soft);
      color: #1f2937;
      font-size: 14px;
      line-height: 1.38;
    }
    .state-band.red .state-meta { background: #fff; }
    .fallback-strip {
      min-height: 76px;
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 12px 15px;
      border: 1px solid #d8a0a0;
      border-left: 8px solid var(--red);
      border-radius: 8px;
      background: #fff;
    }
    .fallback-strip strong { color: var(--red); font-size: 20px; line-height: 1.2; font-weight: 500; }
    .fallback-strip span { color: #111; font-size: 15px; line-height: 1.42; }
    .state-side {
      min-height: 0;
      display: grid;
      grid-template-rows: auto repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .state-thesis {
      margin: 0;
      padding: 15px 17px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 20px;
      line-height: 1.42;
    }
    .side-note {
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .side-note.red { border-left: 6px solid var(--red); background: var(--red-soft); }
    .side-note strong { display: block; color: var(--blue); font-size: 18px; line-height: 1.25; font-weight: 500; }
    .side-note.red strong { color: var(--red); }
    .side-note p { margin: 6px 0 0; color: #111; font-size: 14px; line-height: 1.42; }

    .frip-layout {
      display: grid;
      grid-template-columns: minmax(0, .78fr) minmax(0, 1.22fr);
      gap: 18px;
      min-height: 0;
      align-items: stretch;
    }
    .kpi-rack { display: grid; gap: 10px; align-content: start; }
    .kpi-strip {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .kpi-strip strong { color: var(--blue); font-size: 30px; line-height: 1; font-weight: 500; text-align: center; }
    .kpi-strip.red strong { color: var(--red); }
    .kpi-strip span { display: block; color: #111; font-size: 17px; line-height: 1.35; }
    .kpi-strip em { display: block; margin-top: 4px; color: var(--muted); font-style: normal; font-size: 13px; line-height: 1.3; }
    .frip-board {
      min-height: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #fff, #f9fbfd);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 13px;
    }
    .frip-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #d9e1ea;
      padding-bottom: 10px;
    }
    .frip-header strong { color: var(--blue); font-size: 24px; line-height: 1.2; font-weight: 500; }
    .frip-header span { color: var(--red); font-size: 13px; line-height: 1.2; font-weight: 700; }
    .frip-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .frip-node {
      position: relative;
      min-height: 74px;
      padding: 11px 10px;
      border: 1px solid #d7e1ec;
      border-radius: 8px;
      background: var(--blue-soft);
    }
    .frip-node:not(:last-child)::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 50%;
      width: 10px;
      height: 2px;
      background: var(--red);
    }
    .frip-node span { color: var(--red); font-size: 13px; font-weight: 700; }
    .frip-node strong { display: block; margin-top: 4px; color: var(--blue); font-size: 15px; line-height: 1.25; font-weight: 500; }
    .frip-requirements { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .req-card {
      min-height: 88px;
      padding: 11px 12px;
      border: 1px solid #d9e1ea;
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      background: #fff;
    }
    .req-card.red { border-left-color: var(--red); background: var(--red-soft); }
    .req-card strong { display: block; color: var(--blue); font-size: 16px; line-height: 1.25; font-weight: 500; }
    .req-card.red strong { color: var(--red); }
    .req-card p { margin: 6px 0 0; color: #111; font-size: 13px; line-height: 1.36; }
    .source-chip {
      justify-self: start;
      padding: 6px 10px;
      border: 1px solid rgba(179,0,0,.35);
      border-radius: 999px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }

    .incident-dashboard {
      height: 100%;
      min-height: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 13px;
    }
    [data-key="incident-db"] .slide-body { align-content: stretch; }
    .dash-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) repeat(3, 116px);
      gap: 10px;
      align-items: stretch;
    }

    .thanks .speaker strong { font-size: 25px; }
    .thanks .speaker p { font-size: 18px; }
    .thanks-contact-actions { margin: 14px 0 10px; }
    .thanks-side { display: grid; gap: 13px; align-content: end; justify-items: end; }

    .notes-panel {

      margin: 10px auto 0;

    .custom-text, .custom-media { border: 1px dashed var(--blue); border-radius: 8px; background: var(--blue-soft); padding: 10px 12px; font-size: 16px; line-height: 1.45; }

      .deck-app:not(.is-fullscreen) :is(.body-two, .body-three, .body-figure, .comparison, .flow, .project-row, .cover-meta, .thanks-bottom, .custom-layer, .sotif-map, .case-map, .framework-row, .framework-bottom, .mode-grid, .layer-state-layout, .frip-layout, .dash-head, .dash-grid, .report-layout, .sotif-proof, .iso-path, .event-board, .loop-board, .coverage-row, .bridge-board, .gap-board, .standard-plan, .deliverable-grid, .plan-timeline, .framework-canvas, .mode-map, .mode-quads, .taxonomy-board, .taxonomy-grid, .responsibility-board, .case-board, .case-triage, .case-flow, .ecosystem-board, .ecosystem-chain, .summary-board, .summary-path, .photo-compare, .visual-gap, .notice-visual, .notice-timeline, .notice-list, .method-visual, .mode-visual, .axis-map, .taxonomy-visual, .tax-branches, .tax-output, .responsibility-visual, .case-visual, .case-mini-flow, .final-visual, .purpose-board, .draft-board, .need-board, .lane, .scope-board, .position-board, .chapter-board, .mechanism-board, .mechanism-grid, .workplan-timeline) { grid-template-columns: 1fr; }
      .deck-app:not(.is-fullscreen) .framework-node:not(:last-child)::after { display: none; }

<body>
  <main class="deck-app" id="deck-app" data-deck-id="roam-csae-first-meeting-2026">

      <div class="deck-controls">

  </main>

  <script>
    const A = './assets/presentation/'
    const agenda = [
      '会议目的与讨论边界',

      '范围边界与适用对象',
      '与现有标准的差异和定位',
      '草案框架与后续工作'
    ]

    const slides = [
      {
        key: 'cover',
        type: 'cover',
        notes: '开场先说明这是第一次会议的简要介绍材料，不进入条款技术细节。',
        html: `
          <div class="cover-layout">
            <figure class="cover-media">
              <video src="${A}ad4che-vis-cover.mp4" poster="${A}ad4che-vis-poster.jpg" autoplay muted loop playsinline preload="metadata"></video>
            </figure>
            <div class="cover-bottom">
              <div>
                <h1 class="cover-title-cn editable">标准起草组第一次会议简要介绍材料</h1>
                <p class="cover-title-en editable">高度自动驾驶车辆运营管理异常事件处置规范</p>
              </div>
              <div class="cover-meta">
                <div class="speaker editable">
                  <strong>张玉新</strong>
                  <p>自动驾驶安全联合实验室</p>
                  <p>吉林大学</p>
                  <span class="date">2026年6月</span>
                </div>
                <div class="logos">
                  <img src="${A}ad-safety-joint-lab-logo-transparent.png" alt="自动驾驶安全联合实验室">
                  <img class="logo-partner-strip" src="${A}csae-lead-jlu-logo.png" alt="吉林大学">
                </div>
              </div>
            </div>
          </div>`
      },
      agendaSlide('agenda', -1, '目录', '先给出本次会议材料的结构。'),
      contentSlide('meeting-purpose', '本次会议的目的', `
        <div class="purpose-board" aria-label="本次会议目的和讨论边界">
          <div class="purpose-lead">
            <span class="label">First meeting</span>
            <h3>今天不是为了讨论标准草案的技术细节</h3>
            <p>第一次会议更重要的是统一背景、目标、范围边界和后续协作方式，让大家知道会后应该如何读草案、如何提意见。</p>
          </div>
          <div class="purpose-stack">
            <div class="purpose-item red"><strong>统一认识</strong><p>说明为什么需要面向运营异常事件处置的管理类团体标准。</p></div>

      contentSlide('draft-feedback', '草案状态与会后反馈', `
        <div class="draft-board" aria-label="标准草案状态和会后反馈方式">

            <span class="stamp">标准初稿 v0.97 · 2026-06-15</span>

            <p class="source-line">资料依据：CSAE 立项申请表 20260616；标准初稿 v0.97 20260615。本页为公开摘要，不发布未定稿条款。</p>

            <div class="draft-action"><b>2</b><div><strong>先看框架，再看条款</strong><p>第一次会议重点理解标准为什么要做、边界在哪里、后续怎样组织讨论。</p></div></div>

          </div>
        </div>`, '强调草案是工作基础，邀请会后反馈。'),
      agendaSlide('agenda-background', 1, '目录', '进入立项背景。'),
      contentSlide('why-standard', '为什么需要这项团标', `
        <div class="need-board" aria-label="L4 运营异常治理对象扩展">
          <div class="need-col">
            <h3>过去更关注车辆和系统</h3>

            <div class="need-card"><strong>单车安全边界</strong><p>重点是功能安全、预期功能安全、最小风险状态和安全档案。</p></div>
          </div>
          <div class="need-core">
            <div><strong>治理对象<br>正在扩展</strong><span>L4 规模化运营后，异常不再只发生在车上，也发生在运营组织和协同链条里。</span></div>
          </div>

      applyEdits()

    }

    function show(nextIndex) {
      current = Math.min(Math.max(nextIndex, 0), slides.length - 1)
      document.querySelectorAll('.slide').forEach((slide, i) => {
        slide.classList.toggle('is-active', i === current)
        slide.setAttribute('aria-hidden', i === current ? 'false' : 'true')
      })
      counter.textContent = `${current + 1} / ${slides.length}`
      prev.disabled = current === 0
      next.disabled = current === slides.length - 1
      notesContent.innerHTML = `<p>${slides[current].notes || ''}</p>`
      history.replaceState(null, '', `#slide-${current + 1}`)
    }

    function initialIndex() {

      return match ? Math.min(Math.max(Number(match[1]) - 1, 0), slides.length - 1) : 0

        node.dataset.editId ||= `${node.closest('.slide')?.dataset.key}:${i}`

    function addTextBlock() {

      const key = slides[current].key
      addons[key] ||= []
      addons[key].push({ type: 'text', html: escapeHtml(text.trim()).replace(/\n/g, '<br>') })
      saveAddons()
      renderAddons()
    }

    function addMediaBlock() {
      const url = prompt('粘贴图片或视频 URL；留空则选择本地文件。')
      if (url === null) return
      if (url.trim()) {
        addAddon({ type: /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) ? 'video' : 'image', src: url.trim() })
      } else {
        mediaInput.click()
      }
    }

    function handleMediaFile(event) {
      const file = event.target.files?.[0]
      if (!file) return
      const reader = new FileReader()
      reader.onload = () => addAddon({ type: file.type.startsWith('video/') ? 'video' : 'image', src: reader.result })
      reader.readAsDataURL(file)
      event.target.value = ''
    }

      const key = slides[current].key
      addons[key] ||= []
      addons[key].push(item)

      document.querySelectorAll('.custom-layer').forEach(node => node.remove())
      document.querySelectorAll('.slide').forEach(slide => {
        const items = addons[slide.dataset.key] || []
        if (!items.length) return
        const layer = document.createElement('div')
        layer.className = 'custom-layer'
        items.forEach(item => {
          if (item.type === 'text') {
            const div = document.createElement('div')
            div.className = 'custom-text'
            div.innerHTML = item.html
            div.contentEditable = editMode ? 'true' : 'false'
            layer.appendChild(div)
          } else {

            fig.className = 'custom-media'
            const el = document.createElement(item.type === 'video' ? 'video' : 'img')
            el.src = item.src
            if (item.type === 'video') el.controls = true
            fig.appendChild(el)
            layer.appendChild(fig)
          }
        })
        slide.querySelector('.slide-inner')?.appendChild(layer)

        exitMobilePresentation()
      } else {
        try {
          if (!app.requestFullscreen) throw new Error('Fullscreen API is not available')
          await app.requestFullscreen({ navigationUI: 'hide' })
        } catch {
          enterMobilePresentation()
        }
      }
    }

    function syncFullscreen() {
      const on = document.fullscreenElement === app
      app.classList.toggle('is-fullscreen', on)
      if (!on && !app.classList.contains('is-mobile-presenting')) document.body.classList.remove('mobile-presenting')
      fullscreen.textContent = isPresentationMode() ? '退出全屏' : '全屏'
      if (on) updateFullscreenScale()
    }

    function enterMobilePresentation() {
      document.body.classList.add('mobile-presenting')
      app.classList.add('is-fullscreen', 'is-mobile-presenting')
      fullscreen.textContent = '退出全屏'
      updateFullscreenScale()
    }

    function exitMobilePresentation() {
      document.body.classList.remove('mobile-presenting')
      app.classList.remove('is-fullscreen', 'is-mobile-presenting', 'show-top', 'show-bottom')
      fullscreen.textContent = '全屏'
    }

    function isPresentationMode() {
      return document.fullscreenElement === app || app.classList.contains('is-mobile-presenting')
    }

    function updateFullscreenScale() {
      if (!isPresentationMode()) return
      const baseW = 1280
      const baseH = 720
      const viewport = window.visualViewport
      const w = viewport?.width || innerWidth
      const h = viewport?.height || innerHeight
      const s = Math.min(w / baseW, h / baseH)
      app.style.setProperty('--fsw', `${baseW}px`)
      app.style.setProperty('--fsh', `${baseH}px`)
      app.style.setProperty('--fss', `${s}`)
    }

    function handlePointer(event) {
      if (!isPresentationMode()) return
      app.classList.toggle('show-top', event.clientY <= 84)
      app.classList.toggle('show-bottom', event.clientY >= innerHeight - 84)
      clearTimeout(hideTimer)
      hideTimer = setTimeout(() => {
        app.classList.remove('show-top', 'show-bottom')
      }, 1800)
    }

      if (!touch || isInteractiveTarget(event.target)) return
      touchStartX = touch.clientX
      touchStartY = touch.clientY
      touchStartTime = Date.now()
    }

    function handleTouchEnd(event) {
      const touch = event.changedTouches?.[0]
      if (!touch || isInteractiveTarget(event.target)) return
      const dx = touch.clientX - touchStartX
      const dy = touch.clientY - touchStartY
      const dt = Date.now() - touchStartTime
      if (dt > 900 || Math.abs(dx) < 52 || Math.abs(dx) < Math.abs(dy) * 1.4) return
      show(current + (dx < 0 ? 1 : -1))
    }

    function isInteractiveTarget(target) {
      return target?.isContentEditable || ['A', 'BUTTON', 'INPUT', 'TEXTAREA', 'SELECT', 'VIDEO'].includes(target?.tagName)
    }

    function handleKey(event) {
      const target = event.target
      if (target?.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target?.tagName)) return
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1) }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1) }
      if (event.key === 'Home') { event.preventDefault(); show(0) }
      if (event.key === 'End') { event.preventDefault(); show(slides.length - 1) }
      if (event.key.toLowerCase() === 'f') { event.preventDefault(); toggleFullscreen() }
      if (event.key.toLowerCase() === 'n') { event.preventDefault(); toggleNotes() }
      if (event.key.toLowerCase() === 'e') { event.preventDefault(); toggleEdit() }
    }

    function exportPdf() {
      if (document.fullscreenElement) document.exitFullscreen()
      if (app.classList.contains('is-mobile-presenting')) exitMobilePresentation()
      const oldTitle = document.title
      document.title = 'ROAM-CSAE-First-Meeting-Presentation'
      setTimeout(() => {
        window.print()
        setTimeout(() => document.title = oldTitle, 1000)
      }, 120)
    }

    function readJson(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)) } catch { return fallback }
    }

    function escapeHtml(value) {
      return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;')
    }
  </script>
</body>
