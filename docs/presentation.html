<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L4 自动驾驶远程运营与异常管理开源框架 — ROAM Presentation</title>
  <meta name="description" content="ROAM 面向 CICV SOTIF 工作组的 20 分钟正式演示材料。">
  <link rel="icon" href="https://autozyx.com/assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #17375e;
      --blue-2: #4f81bd;
      --red: #b30000;
      --red-soft: #f7e8e8;
      --blue-soft: #edf4fb;
      --ink: #111111;
      --muted: #5f6b7a;
      --line: #cbd5df;
      --paper: #ffffff;
      --app-bg: #eef1f5;
      --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--app-bg); color: var(--ink); font-family: var(--sans); }
    body { overflow-x: hidden; }
    a { color: inherit; }
    button, select { font-family: inherit; }

    .deck-app {
      --fsw: 1280px;
      --fsh: 720px;
      --fss: 1;
      min-height: 100vh;
      padding: 16px 28px 22px;
      background:
        linear-gradient(90deg, rgba(23, 55, 94, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, #fafafa 0%, #e6ebf1 100%);
      background-size: 44px 44px, auto;
    }

    .deck-app:fullscreen { padding: 0; overflow: hidden; background: #07101d; }
    .deck-topbar, .deck-bottombar {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #2d3a4b;
    }
    .deck-topbar { margin-bottom: 10px; }
    .deck-title { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: #526173; }
    .deck-title a { color: var(--blue); font-size: 18px; text-decoration: none; }
    .deck-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .deck-control, .deck-select, .deck-nav {
      min-height: 34px;
      border: 1px solid #bcc8d6;
      border-radius: 6px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.9);
      color: #334155;
      font-size: 13px;
      cursor: pointer;
    }
    .deck-control:hover, .deck-nav:hover { border-color: var(--blue); color: var(--blue); }
    .deck-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .deck-primary:hover { background: #0d2747; color: #fff; }

    .deck-stage {
      position: relative;
      width: 100%;
      max-width: 1280px;
      height: min(720px, calc(100vh - 138px));
      min-height: 620px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(23, 55, 94, 0.18);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    }

    .deck-stage[data-theme="paper"] .slide { background: #fffdf8; }
    .deck-stage[data-theme="white"] .slide { background: #fff; }
    .deck-stage[data-theme="blueprint"] .slide {
      background:
        linear-gradient(90deg, rgba(79,129,189,0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(79,129,189,0.08) 1px, transparent 1px),
        #fff;
      background-size: 36px 36px;
    }

    .deck-app.is-fullscreen .deck-stage {
      width: 100vw;
      height: 100vh;
      max-width: none;
      min-height: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #07101d;
    }
    .deck-app.is-fullscreen .slide {
      inset: auto;
      left: 50%;
      top: 50%;
      width: var(--fsw);
      height: var(--fsh);
      transform: translate(-50%, -50%) scale(var(--fss));
      transform-origin: center;
    }
    .deck-app.is-fullscreen .slide-body { align-content: start; }
    .deck-app.is-fullscreen [data-key="summary"] .slide-body { align-content: space-between; }
    .deck-app.is-fullscreen .body-two,
    .deck-app.is-fullscreen .body-three,
    .deck-app.is-fullscreen .body-figure { align-items: start; }
    .deck-app.is-fullscreen .deck-topbar,
    .deck-app.is-fullscreen .deck-bottombar {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 50;
      max-width: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .deck-app.is-fullscreen .deck-topbar { top: 0; padding: 10px 16px; transform: translateY(-110%); }
    .deck-app.is-fullscreen .deck-bottombar { bottom: 0; justify-content: center; padding: 8px 14px; transform: translateY(110%); }
    .deck-app.is-fullscreen.show-top .deck-topbar,
    .deck-app.is-fullscreen.show-bottom .deck-bottombar {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
      font-weight: 400;
    }
    .slide.is-active { display: block; }
    .slide-inner { position: relative; height: 100%; padding: 28px 46px 62px; display: flex; flex-direction: column; gap: 16px; }
    .slide-body { flex: 1 1 auto; min-height: 0; display: grid; gap: 18px; align-content: start; }
    .body-two,
    .body-three,
    .body-figure {
      display: grid;
      gap: 18px;
      min-height: 0;
    }
    .body-two { grid-template-columns: minmax(0, 1fr) minmax(0, 0.96fr); }
    .body-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .body-figure { grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); align-items: stretch; }
    .slide:not(.cover):not(.thanks)::after {
      content: "Automated Driving Safety | Yuxin Zhang";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 46px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .kicker { margin: 0 0 7px; color: var(--blue); font-size: 14px; line-height: 1; letter-spacing: .02em; }
    .slide h2 {
      position: relative;
      margin: 0;
      min-height: 60px;
      color: var(--blue);
      font-size: 37px;
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: 0;
    }
    .slide h2::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50px;
      width: 110px;
      height: 4px;
      border: 1px solid var(--blue-2);
      background: linear-gradient(90deg, #b5c6e0, #8eaadb 58%, var(--blue-2));
    }
    .lead { margin: 0; font-size: 20px; line-height: 1.66; color: #151515; }
    .small { font-size: 15px; color: var(--muted); line-height: 1.55; }
    .muted { color: var(--muted); }
    .blue { color: var(--blue); }
    .red { color: var(--red); }
    .center { text-align: center; }

    .cover { padding: 0; }
    .cover-layout { height: 100%; display: grid; grid-template-rows: minmax(0, 0.53fr) minmax(0, 0.47fr); }
    .cover-media { margin: 0; overflow: hidden; background: #d8dee7; }
    .cover-media video, .cover-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .cover-bottom { display: grid; grid-template-rows: auto 1fr; gap: 18px; padding: 24px 46px 28px; background: #fff; box-shadow: 0 -18px 46px rgba(23,55,94,.1); }
    .cover-title-cn { margin: 0; color: var(--blue); font-size: 42px; line-height: 1.15; font-weight: 400; }
    .cover-title-en { margin: 5px 0 0; color: #315f93; font-size: 19px; line-height: 1.2; font-weight: 400; text-transform: uppercase; }
    .cover-meta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 0.38fr); gap: 36px; align-items: end; }
    .speaker strong { display: block; font-size: 26px; line-height: 1.2; font-weight: 400; color: #111; }
    .speaker p { margin: 6px 0 0; font-size: 19px; line-height: 1.38; color: #111; }
    .speaker .date { display: block; margin-top: 16px; color: #9a9a9a; font-size: 15px; font-weight: 600; }
    .logos { display: grid; gap: 10px; justify-items: end; align-content: end; }
    .logos img { display: block; width: 100%; max-width: 390px; max-height: 68px; object-fit: contain; object-position: right center; }

    .agenda .slide-inner { justify-content: flex-start; }
    .agenda h2 { margin-top: 21px; }
    .agenda-list { display: grid; gap: 18px; margin: 78px 0 0; padding: 0; list-style: none; }
    .agenda-list li { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: baseline; font-size: 28px; line-height: 1.35; color: #111; }
    .agenda-list span { color: var(--blue); font-size: 18px; font-weight: 400; }
    .agenda-list strong { font-weight: 400; }
    .agenda-list li.current span, .agenda-list li.current strong { color: var(--red); }

    .card, .metric, .panel, .mini-card, .source-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      color: #111;
    }
    .card { padding: 16px 18px; }
    .card h3, .panel h3 { margin: 0 0 8px; color: var(--blue); font-size: 23px; line-height: 1.28; font-weight: 500; }
    .card p, .panel p { margin: 0; font-size: 16px; line-height: 1.55; color: #1f2937; }
    .card.red { border-left: 6px solid var(--red); background: var(--red-soft); }
    .card.blue { border-left: 6px solid var(--blue); background: var(--blue-soft); }
    .card strong { color: var(--blue); font-weight: 600; }
    .callout { margin: 0; padding: 14px 18px; border-left: 6px solid var(--red); border-radius: 8px; background: var(--red-soft); color: #111; font-size: 20px; line-height: 1.5; }
    .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .list li { padding: 12px 14px; border-left: 5px solid var(--blue); border-radius: 6px; background: var(--blue-soft); font-size: 17px; line-height: 1.46; }
    .list li.red { border-left-color: var(--red); background: var(--red-soft); }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .metric { min-height: 96px; padding: 13px 14px; display: grid; place-content: center; text-align: center; }
    .metric strong { display: block; color: var(--blue); font-size: 34px; line-height: 1; font-weight: 500; }
    .metric span { display: block; margin-top: 8px; color: #111; font-size: 15px; line-height: 1.25; }
    .metric.compact { min-height: 78px; padding: 10px 12px; }
    .metric.compact strong { font-size: 24px; line-height: 1.12; }
    .metric.compact span { margin-top: 6px; font-size: 14px; }

    .figure { margin: 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
    .figure img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .figure.cover-fit img { object-fit: cover; object-position: top center; }
    .figure.tight { border: 0; }
    .figure.document-shot { display: block; background: #f8fafc; }
    .figure.document-shot img { object-fit: cover; object-position: top center; }
    .figure.report-cover { background: #06111f; }
    .figure.report-cover img { object-fit: cover; object-position: center; }
    .visual-stack { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; }

    .timeline { display: grid; gap: 10px; }
    .timeline-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: start; }
    .timeline-row time { color: var(--red); font-size: 18px; line-height: 1.35; }
    .timeline-row div { padding: 12px 14px; border-left: 5px solid var(--blue); background: var(--blue-soft); border-radius: 8px; font-size: 17px; line-height: 1.5; }

    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .compare-card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .compare-card header { padding: 13px 16px; color: #fff; background: var(--blue); }
    .compare-card:nth-child(2) header { background: var(--red); }
    .compare-card h3 { margin: 0; font-size: 23px; line-height: 1.25; font-weight: 500; }
    .compare-card ul { margin: 0; padding: 16px 18px 18px 34px; font-size: 16px; line-height: 1.55; }

    .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
    .flow .step { position: relative; padding: 16px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; min-height: 116px; }
    .flow .step:not(:last-child)::after { content: ""; position: absolute; right: -12px; top: 50%; width: 12px; height: 2px; background: var(--red); }
    .flow .step span { color: var(--red); font-size: 15px; font-weight: 700; }
    .flow .step strong { display: block; margin: 5px 0; color: var(--blue); font-size: 19px; font-weight: 600; line-height: 1.3; }
    .flow .step p { margin: 0; font-size: 14px; color: #4b5563; line-height: 1.45; }

    .matrix { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; font-size: 15px; line-height: 1.38; }
    .matrix th, .matrix td { border: 1px solid #d9e1ea; padding: 10px 12px; text-align: left; vertical-align: top; }
    .matrix th { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
    .matrix .hl { color: var(--red); font-weight: 600; }
    .standards-table { font-size: 13.2px; line-height: 1.28; }
    .standards-table th, .standards-table td { padding: 7px 9px; }
    .standards-table col:nth-child(1) { width: 43%; }
    .standards-table col:nth-child(2) { width: 25%; }
    .standards-table col:nth-child(3) { width: 32%; }

    .proof-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .proof-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .proof-grid.stack { grid-template-columns: 1fr; }
    .proof-card {
      min-height: 112px;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .proof-card .tagline { color: var(--red); font-size: 14px; line-height: 1.2; font-weight: 600; }
    .proof-card strong { color: var(--blue); font-size: 20px; line-height: 1.25; font-weight: 500; }
    .proof-card p { margin: 0; color: #111; font-size: 15px; line-height: 1.45; }
    .proof-card.red { border-left: 6px solid var(--red); background: var(--red-soft); }
    .proof-card.blue { border-left: 6px solid var(--blue); background: var(--blue-soft); }
    .proof-card.compact { min-height: 92px; padding: 12px 14px; }
    .proof-card.compact strong { font-size: 18px; }
    .proof-card.compact p { font-size: 14px; }
    .source-line { margin: 0; color: #5f6b7a; font-size: 12px; line-height: 1.35; }
    .source-line a { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(23,55,94,.25); }
    .compare-card .source-line { padding: 0 18px 14px 34px; }
    .status-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .status-pill { display: inline-flex; align-items: center; min-height: 28px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--blue); background: #fff; font-size: 13px; line-height: 1; }
    .status-pill.red { border-color: #d8a0a0; color: var(--red); background: var(--red-soft); }
    .formula { font-family: "SF Mono", Menlo, Consolas, monospace; color: #111; font-size: 13px; line-height: 1.42; background: #f8fafc; border: 1px solid #d9e1ea; border-radius: 6px; padding: 8px 10px; }

    .sotif-map { display: grid; grid-template-columns: 1.02fr 1fr; gap: 14px; align-items: stretch; }
    .sotif-cycle {
      min-height: 360px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: center;
    }
    .sotif-node {
      position: relative;
      min-height: 88px;
      padding: 13px 14px 13px 48px;
      border: 1px solid #d9e1ea;
      border-left: 6px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      display: grid;
      align-content: center;
      gap: 4px;
    }
    .sotif-node .num {
      position: absolute;
      left: 13px;
      top: 14px;
      color: var(--blue);
      font-size: 16px;
      line-height: 1;
      font-weight: 700;
    }
    .sotif-node strong { color: var(--blue); font-size: 18px; line-height: 1.22; font-weight: 500; }
    .sotif-node span { color: #334155; font-size: 13px; line-height: 1.35; }
    .sotif-node.red { border-left-color: var(--red); background: var(--red-soft); }
    .sotif-node.red .num, .sotif-node.red strong { color: var(--red); }
    .framework-diagram {
      min-height: 315px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      gap: 10px;
    }
    .framework-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; align-items: stretch; }
    .framework-node {
      position: relative;
      min-height: 108px;
      padding: 12px 10px;
      border: 1px solid #d9e1ea;
      border-radius: 8px;
      background: var(--blue-soft);
      display: grid;
      align-content: start;
      gap: 6px;
    }
    .framework-node:not(:last-child)::after {
      content: "";
      position: absolute;
      right: -9px;
      top: 50%;
      width: 9px;
      height: 2px;
      background: var(--red);
    }
    .framework-node.red { background: var(--red-soft); border-color: #d8a0a0; }
    .framework-node strong { color: var(--blue); font-size: 17px; line-height: 1.22; font-weight: 500; }
    .framework-node.red strong { color: var(--red); }
    .framework-node p { margin: 0; color: #334155; font-size: 12px; line-height: 1.34; }
    .framework-bottom { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .mode-card {
      min-height: 96px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--blue);
      border-radius: 8px;
      background: #fff;
    }
    .mode-card.red { border-left-color: var(--red); background: var(--red-soft); }
    .mode-card strong { display: block; color: var(--blue); font-size: 19px; line-height: 1.22; font-weight: 500; }
    .mode-card.red strong { color: var(--red); }
    .mode-card p { margin: 6px 0 0; color: #111; font-size: 14px; line-height: 1.42; }
    .layer-diagram { display: grid; gap: 11px; }
    .layer-card {
      position: relative;
      min-height: 104px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-left: 7px solid var(--blue);
      border-radius: 8px;
      background: #fff;
    }
    .layer-card.red { border-left-color: var(--red); background: var(--red-soft); }
    .layer-card strong { color: var(--blue); font-size: 21px; line-height: 1.22; font-weight: 500; }
    .layer-card.red strong { color: var(--red); }
    .layer-card p { margin: 7px 0 0; color: #111; font-size: 15px; line-height: 1.42; }
    .case-map { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; align-items: stretch; }
    .case-chain { display: grid; gap: 10px; }
    .case-step {
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      gap: 5px;
    }
    .case-step strong { color: var(--blue); font-size: 19px; line-height: 1.25; font-weight: 500; }
    .case-step p { margin: 0; color: #111; font-size: 14px; line-height: 1.4; }
    .case-step.red { border-left: 6px solid var(--red); background: var(--red-soft); }
    .summary-statement {
      margin: 0;
      padding: 18px 22px;
      border-left: 7px solid var(--red);
      border-radius: 8px;
      background: var(--red-soft);
      color: #111;
      font-size: 30px;
      line-height: 1.35;
    }
    [data-key="summary"] .slide-body { align-content: space-between; }

    .standard-card { padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 12px 28px rgba(23,55,94,.08); }
    .standard-card .label { color: var(--red); font-size: 16px; font-weight: 700; }
    .standard-card h3 { margin: 8px 0 10px; color: var(--blue); font-size: 27px; line-height: 1.28; font-weight: 400; }
    .standard-card p { margin: 0; color: #111; font-size: 17px; line-height: 1.55; }
    .stamp { display: inline-flex; align-items: center; min-height: 34px; padding: 5px 12px; border: 1px solid var(--red); border-radius: 999px; color: var(--red); background: var(--red-soft); font-size: 15px; font-weight: 700; }

    .project-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

      contentSlide('problem', '远程运营异常与 SOTIF 的关联', `

          <div class="project">
            <figure><img src="${A}project-roam.png" alt="ROAM"></figure>
            <div><strong>ROAM</strong><p>管理边界被触发后的运营异常、责任分配、KPI 和处置证据。</p></div>
          </div>
        </div>
        <p class="callout">ODC 说明系统应该在哪里运行；ROAM 回答异常发生后如何治理；DRIVEResearch 提供正常行为与风险场景的数据基线。</p>`, '这页延续 OpenODC 中三个项目关系的表达。'),
      agendaSlide('agenda-summary', 4, '目录', '进入最后总结。'),
      contentSlide('summary', '把运行阶段证据转化为标准输入', `
        <div class="body-three">
          <div class="card blue">
            <h3>问题</h3>
            <p>L4 规模化后，安全挑战从单车能力扩展到运营异常处置、车队韧性和责任闭环。</p>
          </div>
          <div class="card red">
            <h3>方法</h3>
            <p>ROAM 提供异常分类、三层架构、责任矩阵、KPI、第一响应者交互计划和验证方法。</p>
          </div>
          <div class="card blue">
            <h3>路径</h3>
            <p>通过开源项目持续沉淀证据，并承接到团体标准预研和后续国家、国际标准讨论。</p>
          </div>
        </div>
        <p class="summary-statement editable">ROAM<br>让 L4 运营异常从分散事件变成公共证据。</p>
        <div class="button-row">
          <a class="link-button" href="https://roam.autozyx.com/" target="_blank" rel="noopener">ROAM 官网</a>
          <a class="link-button" href="https://github.com/AutoZYX-Labs/ROAM" target="_blank" rel="noopener">GitHub</a>
          <a class="link-button red" href="https://ROAM-explorer.autozyx.com" target="_blank" rel="noopener">ROAM Explorer</a>
        </div>`, '最后一页前，明确共建方式。'),
      {
        key: 'thanks',
        type: 'thanks',
        notes: '感谢页保持和 OpenODC 风格一致。',
        html: `
          <div class="thanks-layout">
            <figure class="thanks-hero"><img src="${A}background-2.png" alt="自动驾驶安全联合实验室背景图"></figure>
            <div class="thanks-bottom">
              <div>
                <h2 class="thanks-title editable">感谢关注</h2>
                <div class="speaker editable">
                  <strong>张玉新</strong>
                  <p>自动驾驶安全联合实验室</p>
                  <p>吉林大学汽车底盘集成与仿生全国重点实验室</p>
                  <div class="button-row thanks-contact-actions">
                    <a class="link-button" href="https://roam.autozyx.com/" target="_blank" rel="noopener">ROAM</a>
                    <a class="link-button" href="https://autozyx.com/" target="_blank" rel="noopener">个人主页</a>
                    <a class="link-button red" href="https://github.com/AutoZYX-Labs/ROAM" target="_blank" rel="noopener">GitHub</a>
                  </div>
                  <p>微信公众号：张玉新-AutoZYX</p>
                </div>
              </div>
              <div class="thanks-side">
                <div class="logos">
                  <img src="${A}ad-safety-joint-lab-logo-transparent.png" alt="自动驾驶安全联合实验室">
                  <img src="${A}state-key-lab-logo-transparent.png" alt="汽车底盘集成与仿生全国重点实验室">
                </div>
              </div>
            </div>
          </div>`
      }
    ]

    function contentSlide(key, title, body, notes) {
      return {
        key,
        type: 'content',
        notes,
        html: `<div class="slide-inner"><div><p class="kicker editable">ROAM · L4 运营异常管理</p><h2 class="editable">${title}</h2></div><div class="slide-body">${body}</div></div>`
      }
    }

    function agendaSlide(key, current, title, notes) {
      return {
        key,
        type: 'agenda',
        notes,
        html: `<div class="slide-inner"><h2 class="editable">${title}</h2><ol class="agenda-list">${agenda.map((item, i) => `<li class="${i === current ? 'current' : ''}"><span>0${i + 1}</span><strong class="editable">${item}</strong></li>`).join('')}</ol></div>`
      }
    }

    const app = document.getElementById('deck-app')
    const stage = document.getElementById('stage')
    const counter = document.getElementById('counter')
    const prev = document.getElementById('prev')
    const next = document.getElementById('next')
    const notesPanel = document.getElementById('notes-panel')
    const notesContent = document.getElementById('notes-content')
    const theme = document.getElementById('theme')
    const edit = document.getElementById('edit')
    const addText = document.getElementById('add-text')
    const addMedia = document.getElementById('add-media')
    const mediaInput = document.getElementById('media-input')
    const notes = document.getElementById('notes')
    const exportBtn = document.getElementById('export')
    const fullscreen = document.getElementById('fullscreen')
    const storagePrefix = app.dataset.deckId
    const editKey = `${storagePrefix}:edits`
    const addonKey = `${storagePrefix}:addons`
    let current = initialIndex()
    let editMode = false
    let edits = readJson(editKey, {})
    let addons = readJson(addonKey, {})
    let hideTimer = null

    renderDeck()
    show(current)

    prev.addEventListener('click', () => show(current - 1))
    next.addEventListener('click', () => show(current + 1))
    theme.addEventListener('change', () => stage.dataset.theme = theme.value)
    edit.addEventListener('click', toggleEdit)
    notes.addEventListener('click', toggleNotes)
    exportBtn.addEventListener('click', exportPdf)
    fullscreen.addEventListener('click', toggleFullscreen)
    addText.addEventListener('click', addTextBlock)
    addMedia.addEventListener('click', addMediaBlock)
    mediaInput.addEventListener('change', handleMediaFile)
    document.addEventListener('fullscreenchange', syncFullscreen)
    window.addEventListener('resize', updateFullscreenScale)
    app.addEventListener('pointermove', handlePointer)
    document.addEventListener('keydown', handleKey)

    function renderDeck() {
      stage.innerHTML = slides.map((slide, i) => `<article class="slide ${slide.type} ${i === current ? 'is-active' : ''}" data-key="${slide.key}" aria-hidden="${i === current ? 'false' : 'true'}">${slide.html}</article>`).join('')
      applyEdits()
      renderAddons()
    }

    function show(nextIndex) {
      current = Math.min(Math.max(nextIndex, 0), slides.length - 1)
      document.querySelectorAll('.slide').forEach((slide, i) => {
        slide.classList.toggle('is-active', i === current)
        slide.setAttribute('aria-hidden', i === current ? 'false' : 'true')
      })
      counter.textContent = `${current + 1} / ${slides.length}`
      prev.disabled = current === 0
      next.disabled = current === slides.length - 1
      notesContent.innerHTML = `<p>${slides[current].notes || ''}</p>`
      history.replaceState(null, '', `#slide-${current + 1}`)
    }

    function initialIndex() {
      const match = location.hash.match(/slide-(\d+)/)
      return match ? Math.min(Math.max(Number(match[1]) - 1, 0), slides.length - 1) : 0
    }

    function toggleEdit() {
      editMode = !editMode
      document.body.classList.toggle('edit-mode', editMode)
      edit.textContent = editMode ? '完成' : '微调'
      document.querySelectorAll('.editable, .custom-text').forEach(node => {
        node.contentEditable = editMode ? 'true' : 'false'
        node.spellcheck = false
      })
      document.querySelectorAll('.editable').forEach((node, i) => {
        node.dataset.editId ||= `${node.closest('.slide')?.dataset.key}:${i}`
        node.oninput = () => {
          edits[node.dataset.editId] = node.innerHTML
          localStorage.setItem(editKey, JSON.stringify(edits))
        }
      })
    }

    function applyEdits() {
      document.querySelectorAll('.editable').forEach((node, i) => {
        node.dataset.editId ||= `${node.closest('.slide')?.dataset.key}:${i}`
        if (edits[node.dataset.editId]) node.innerHTML = edits[node.dataset.editId]
      })
    }

    function addTextBlock() {
      const text = prompt('请输入要添加到当前页的大段文字：')
      if (!text || !text.trim()) return
      const key = slides[current].key
      addons[key] ||= []
      addons[key].push({ type: 'text', html: escapeHtml(text.trim()).replace(/\n/g, '<br>') })
      saveAddons()
      renderAddons()
    }

    function addMediaBlock() {
      const url = prompt('粘贴图片或视频 URL；留空则选择本地文件。')
      if (url === null) return
      if (url.trim()) {
        addAddon({ type: /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) ? 'video' : 'image', src: url.trim() })
      } else {
        mediaInput.click()
      }
    }

    function handleMediaFile(event) {
      const file = event.target.files?.[0]
      if (!file) return
      const reader = new FileReader()
      reader.onload = () => addAddon({ type: file.type.startsWith('video/') ? 'video' : 'image', src: reader.result })
      reader.readAsDataURL(file)
      event.target.value = ''
    }

    function addAddon(item) {
      const key = slides[current].key
      addons[key] ||= []
      addons[key].push(item)
      saveAddons()
      renderAddons()
    }

    function saveAddons() {
      try {
        localStorage.setItem(addonKey, JSON.stringify(addons))
      } catch {
        alert('浏览器本地存储空间不足。请使用更小的素材，或把素材加入项目资源目录。')
      }
    }

    function renderAddons() {
      document.querySelectorAll('.custom-layer').forEach(node => node.remove())
      document.querySelectorAll('.slide').forEach(slide => {
        const items = addons[slide.dataset.key] || []
        if (!items.length) return
        const layer = document.createElement('div')
        layer.className = 'custom-layer'
        items.forEach(item => {
          if (item.type === 'text') {
            const div = document.createElement('div')
            div.className = 'custom-text'
            div.innerHTML = item.html
            div.contentEditable = editMode ? 'true' : 'false'
            layer.appendChild(div)
          } else {
            const fig = document.createElement('figure')
            fig.className = 'custom-media'
            const el = document.createElement(item.type === 'video' ? 'video' : 'img')
            el.src = item.src
            if (item.type === 'video') el.controls = true
            fig.appendChild(el)
            layer.appendChild(fig)
          }
        })
        slide.querySelector('.slide-inner')?.appendChild(layer)
      })
    }

    function toggleNotes() {
      notesPanel.hidden = !notesPanel.hidden
      notes.classList.toggle('deck-primary', !notesPanel.hidden)
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement) {
        await document.exitFullscreen()
      } else {
        await app.requestFullscreen()
      }
    }

    function syncFullscreen() {
      const on = document.fullscreenElement === app
      app.classList.toggle('is-fullscreen', on)
      fullscreen.textContent = on ? '退出全屏' : '全屏'
      if (on) updateFullscreenScale()
    }

    function updateFullscreenScale() {
      if (document.fullscreenElement !== app) return
      const baseW = 1280
      const baseH = 720
      const s = Math.min(innerWidth / baseW, innerHeight / baseH)
      app.style.setProperty('--fsw', `${baseW}px`)
      app.style.setProperty('--fsh', `${baseH}px`)
      app.style.setProperty('--fss', `${s}`)
    }

    function handlePointer(event) {
      if (document.fullscreenElement !== app) return
      app.classList.toggle('show-top', event.clientY <= 84)
      app.classList.toggle('show-bottom', event.clientY >= innerHeight - 84)
      clearTimeout(hideTimer)
      hideTimer = setTimeout(() => {
        app.classList.remove('show-top', 'show-bottom')
      }, 1800)
    }

    function handleKey(event) {
      const target = event.target
      if (target?.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target?.tagName)) return
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1) }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1) }
      if (event.key === 'Home') { event.preventDefault(); show(0) }
      if (event.key === 'End') { event.preventDefault(); show(slides.length - 1) }
      if (event.key.toLowerCase() === 'f') { event.preventDefault(); toggleFullscreen() }
      if (event.key.toLowerCase() === 'n') { event.preventDefault(); toggleNotes() }
      if (event.key.toLowerCase() === 'e') { event.preventDefault(); toggleEdit() }
    }

    function exportPdf() {
      if (document.fullscreenElement) document.exitFullscreen()
      const oldTitle = document.title
      document.title = 'ROAM-CICV-SOTIF-Presentation'
      setTimeout(() => {
        window.print()
        setTimeout(() => document.title = oldTitle, 1000)
      }, 120)
    }

    function readJson(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)) } catch { return fallback }
    }

    function escapeHtml(value) {
      return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;')
    }
  </script>
</body>
</html>
